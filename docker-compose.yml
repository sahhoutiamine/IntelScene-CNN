services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    ports:
      - "127.0.0.1:8501:8501" # Streamlit (later)
      - "127.0.0.1:8888:8888" # Jupyter (optional)
    stdin_open: true
    tty: true
    command: sleep infinity
