# Step 4 & 6 - experiments. Run:  python -m src.training.train --exp <name>
defaults:
  epochs: 40
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 6
  reduce_lr_patience: 3
  reduce_lr_factor: 0.5

experiments:
  baseline:
    model: {filters: [32, 64, 128], dropout: 0.3, dense_units: 128, pooling: gap, batch_norm: false}
    augmentation: {enabled: true, flip: true, rotation: 0.10, zoom: 0.10, translation: 0.10, contrast: 0.10}

  wider_bn_dropout:          # more filters + BatchNorm + stronger Dropout
    model: {filters: [32, 64, 128, 256], convs_per_block: 1, dropout: 0.5, dense_units: 256, pooling: gap, batch_norm: true}
    augmentation: {enabled: true, flip: true, rotation: 0.10, zoom: 0.10, translation: 0.10, contrast: 0.10}

  no_augmentation:           # measure the impact of Data Augmentation
    model: {filters: [32, 64, 128], dropout: 0.3, dense_units: 128, pooling: gap, batch_norm: false}
    augmentation: {enabled: false}

  lr_batch_tuned:            # lower learning rate + bigger batch
    learning_rate: 0.0005
    batch_size: 64
    model: {filters: [32, 64, 128], dropout: 0.3, dense_units: 128, pooling: gap, batch_norm: true}
    augmentation: {enabled: true, flip: true, rotation: 0.10, zoom: 0.10, translation: 0.10, contrast: 0.10}
